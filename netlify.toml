[build]
command = "npm run build:client"
functions = "netlify/functions"
publish = "dist/spa"

[build.environment]
NODE_VERSION = "22"

[functions]
external_node_modules = ["express"]
node_bundler = "esbuild"

# API -> serverless function
[[redirects]]
force = true
from = "/api/*"
status = 200
to = "/.netlify/functions/api/:splat"

# SPA fallback: every non-file path serves index.html so client-side routes
# like /auth or /inbox work on hard refresh and deep links.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
